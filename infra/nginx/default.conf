# Reverse proxy for the FastAPI service. The Next.js frontend keeps calling
# http://localhost:8000 directly in development; this proxy exists for the
# deployment path described in the security blueprint.
limit_req_zone $binary_remote_addr zone=analyze:10m rate=10r/m;

upstream deeptune_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/v1/queries/analyze {
        limit_req zone=analyze burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://deeptune_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://deeptune_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://deeptune_api/api/v1/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
